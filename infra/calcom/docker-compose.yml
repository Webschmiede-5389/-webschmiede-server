# Cal.com self-hosted (Webschmiede) — nginx proxies /cal/ -> :3000
services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.25"
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calendso
    volumes:
      - cal_pg:/var/lib/postgresql/data

  calcom:
    image: calcom/cal.com:v6.2.0
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.0"
    depends_on:
      - database
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://cal:${POSTGRES_PASSWORD}@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://cal:${POSTGRES_PASSWORD}@database:5432/calendso
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${CAL_PUBLIC_URL}
      NEXTAUTH_URL: ${CAL_PUBLIC_URL}
      WEBAPP_URL: ${CAL_PUBLIC_URL}
      TZ: Europe/Berlin

volumes:
  cal_pg:
