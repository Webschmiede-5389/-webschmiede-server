# Branding configuration example — no free CSS/JS from tenants.
version: 1
modes:
  AGENCY_INTERNAL:
    brand_name: WebSchmiede
    brand_subtitle: Digitale Handwerkskunst
    logo_full: /brand/webschmiede/logo-horizontal.png
    logo_compact: /brand/webschmiede/logo-mark.png
    favicon: /brand/webschmiede/favicon.png
    primary_color: "#FF6600"
    primary_hover: "#E55A00"
    support_name: Digitale Handwerkskunst
    support_url: https://digitalehandwerkskunst.de/agency-hub
    powered_by_visible: false

  AGENCY_CUSTOMER_MANAGEMENT:
    inherits: AGENCY_INTERNAL
    powered_by_visible: false
    # customer logo optional as context chip only

  CUSTOMER_PORTAL:
    brand_name: "{tenant_name}"
    brand_subtitle: ""
    logo_full: "{tenant_logo}"
    logo_compact: "{tenant_logo}"
    favicon: "{tenant_favicon}"
    primary_color: "{tenant_primary}"
    primary_hover: "{tenant_primary_hover}"
    support_name: "{support_contact}"
    support_url: ""
    powered_by_visible: true

  PUBLIC_CUSTOMER_SITE:
    note: Customer branding only; do not force WebSchmiede orange

  EXTERNAL_SERVICE_CARD:
    note: Vendor UI unchanged; ToolCard uses Agency chrome only

# Allowed primary colors for customer portals (hex only). Expand carefully.
allowed_customer_primary_hex_pattern: "^#[0-9A-Fa-f]{6}$"
forbidden:
  - free_css
  - free_javascript
  - remote_font_urls
  - arbitrary_logo_hosts
