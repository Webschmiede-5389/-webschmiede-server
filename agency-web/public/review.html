<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Webschmiede · Ansichten prüfen</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e7e2;color:#25251f;font:13px system-ui}header{padding:16px 22px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:2}select,a{padding:10px;color:inherit}main{padding:24px;width:max-content;min-width:100%}iframe{display:block;margin:auto;border:0;background:#fff;box-shadow:0 3px 20px #0001}small{display:block;text-align:center;padding:12px}</style></head><body><header><b>Webschmiede · Gestaltungsentwurf</b><label>Ansicht <select id="width"><option value="390">Mobil · 390 px</option><option value="360">Mobil klein · 360 px</option><option value="768">Tablet · 768 px</option><option value="1440">Desktop · 1440 px</option></select></label><button id="full">Ganze Seite anzeigen</button><a href="/pilot.html">Seite direkt öffnen ↗</a></header><small>Responsive Browseransicht. Kein Test auf einem physischen Smartphone.</small><main><iframe title="Webschmiede Seitenentwurf" src="/pilot.html" width="390" height="850"></iframe></main><script>const frame=document.querySelector('iframe');let full=false;function resize(){frame.style.height=full?frame.contentDocument.body.scrollHeight+'px':'844px'}frame.addEventListener('load',resize);document.querySelector('select').addEventListener('change',e=>{frame.width=e.target.value;requestAnimationFrame(resize)});document.querySelector('#full').addEventListener('click',e=>{full=!full;e.target.textContent=full?'Gerätehöhe anzeigen':'Ganze Seite anzeigen';resize()});</script></body></html>
