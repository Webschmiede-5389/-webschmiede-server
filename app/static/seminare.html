<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <title>Seminare & Beratung – Webschmiede</title>
  <meta name="description" content="Workshops und 1:1-Beratung für Gastronomie und lokale Unternehmen – Webschmiede Digitale Handwerkskunst.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.bunny.net/css?family=playfair-display:700,800|inter:300,400,500,600,700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#C9A84C', dark: '#111111', card: '#1a1a1a', border: '#2a2a2a', muted: '#888' },
          fontFamily: { serif: ['Playfair Display','serif'], sans: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background: #0e0b08; color: #fff; font-family: 'Inter', sans-serif; }
    .seminar-card { background: #15120d; border: 1px solid #2a2a2a; border-radius: 16px; transition: border-color .2s; }
    .seminar-card:hover { border-color: #C9A84C; }
    .btn-gold { background: linear-gradient(135deg, #C9A84C, #e8c76a); color: #000; font-weight: 700; }
    .btn-gold:disabled { opacity: .45; cursor: not-allowed; }
    .modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; padding: 16px; }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal-box { background: #15120d; border: 1px solid #2a2a2a; border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 28px; }
    input, textarea { background: #0e0b08; border: 1px solid #2a2a2a; border-radius: 10px; padding: 12px 14px; width: 100%; color: #fff; font-size: 15px; }
    input:focus, textarea:focus { outline: none; border-color: #C9A84C; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-border px-5 py-5 max-w-3xl mx-auto">
    <p class="text-gold text-xs font-semibold tracking-widest uppercase mb-1">Webschmiede</p>
    <h1 class="font-serif text-3xl font-bold">Seminare & Beratung</h1>
    <p class="text-muted text-sm mt-2">Digitale Handwerkskunst für Gastronomie und lokale Betriebe.</p>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-8 space-y-10">
    <section class="seminar-card p-6">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 rounded-full bg-gold/15 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-calendar-check text-gold text-lg"></i>
        </div>
        <div class="flex-1">
          <h2 class="font-serif text-xl font-bold mb-1">1:1 Erstgespräch</h2>
          <p class="text-muted text-sm mb-4">30 Minuten, unverbindlich. Wir schauen, was für deinen Betrieb Sinn macht.</p>
          <a id="cal-link" href="#" target="_blank" rel="noopener"
             class="inline-flex items-center gap-2 btn-gold px-5 py-3 rounded-full text-sm">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Termin buchen
          </a>
        </div>
      </div>
    </section>

    <section>
      <h2 class="font-serif text-2xl font-bold mb-4">Kommende Seminare</h2>
      <div id="seminar-list" class="space-y-4">
        <p class="text-muted text-sm">Lade Seminare…</p>
      </div>
    </section>
  </main>

  <footer class="text-center text-muted text-xs py-10 border-t border-border mt-8">
    Webschmiede · Digitale Handwerkskunst
  </footer>

  <div id="modal" class="modal-bg" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="flex justify-between items-start mb-4">
        <div>
          <p class="text-gold text-xs uppercase tracking-wider mb-1">Anmeldung</p>
          <h3 id="modal-title" class="font-serif text-xl font-bold"></h3>
        </div>
        <button type="button" onclick="closeModal()" class="text-muted hover:text-white text-xl leading-none">&times;</button>
      </div>
      <form id="reg-form" onsubmit="submitReg(event)">
        <input type="hidden" id="reg-seminar-id">
        <div class="field"><label for="reg-name">Name *</label><input id="reg-name" required maxlength="100" autocomplete="name"></div>
        <div class="field"><label for="reg-email">E-Mail *</label><input id="reg-email" type="email" required maxlength="255" autocomplete="email"></div>
        <div class="field"><label for="reg-phone">Telefon (optional)</label><input id="reg-phone" type="tel" maxlength="30" autocomplete="tel"></div>
        <div class="field"><label for="reg-company">Betrieb / Firma (optional)</label><input id="reg-company" maxlength="100"></div>
        <div class="field"><label for="reg-notes">Nachricht (optional)</label><textarea id="reg-notes" rows="3" maxlength="500"></textarea></div>
        <p id="reg-error" class="text-red-400 text-sm mb-3 hidden"></p>
        <button type="submit" id="reg-btn" class="w-full btn-gold py-3 rounded-full text-sm">Jetzt anmelden</button>
      </form>
    </div>
  </div>

  <script>
    let calUrl = '/cal';
    let seminars = [];

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function fmtDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
      return `${parseInt(day,10)}. ${months[parseInt(m,10)-1]} ${y}`;
    }

    function openModal(id) {
      const s = seminars.find(x => x.id === id);
      if (!s || s.full) return;
      document.getElementById('reg-seminar-id').value = id;
      document.getElementById('modal-title').textContent = s.title;
      document.getElementById('reg-error').classList.add('hidden');
      document.getElementById('reg-form').reset();
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function renderList() {
      const el = document.getElementById('seminar-list');
      if (!seminars.length) {
        el.innerHTML = '<p class="text-muted text-sm">Aktuell keine Seminare geplant. Buche gern ein 1:1-Gespräch.</p>';
        return;
      }
      el.innerHTML = seminars.map(s => `
        <article class="seminar-card p-6">
          <div class="flex flex-wrap justify-between gap-2 mb-2">
            <h3 class="font-serif text-lg font-bold">${esc(s.title)}</h3>
            <span class="text-gold text-sm font-medium">${esc(fmtDate(s.event_date))}${s.event_time ? ' · ' + esc(s.event_time) : ''}</span>
          </div>
          <p class="text-muted text-sm mb-3">${esc(s.description)}</p>
          <p class="text-xs text-muted mb-4"><i class="fa-solid fa-location-dot mr-1"></i>${esc(s.location || 'Online')}</p>
          <div class="flex flex-wrap items-center justify-between gap-3">
            <span class="text-sm ${s.full ? 'text-red-400' : 'text-muted'}">
              ${s.full ? 'Ausgebucht' : `${s.seats_left} von ${s.max_seats} Plätzen frei`}
            </span>
            <button type="button" onclick="openModal(${s.id})" ${s.full ? 'disabled' : ''}
              class="btn-gold px-5 py-2.5 rounded-full text-sm">${s.full ? 'Warteliste bald' : 'Anmelden'}</button>
          </div>
        </article>
      `).join('');
    }

    async function loadSeminars() {
      try {
        const r = await fetch('/api/seminars');
        const data = await r.json();
        seminars = data.seminars || [];
        if (data.calcom_url) {
          calUrl = data.calcom_url;
          document.getElementById('cal-link').href = calUrl;
        }
        renderList();
      } catch (e) {
        document.getElementById('seminar-list').innerHTML = '<p class="text-red-400 text-sm">Seminare konnten nicht geladen werden.</p>';
      }
    }

    async function submitReg(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const err = document.getElementById('reg-error');
      err.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Wird gesendet…';
      const id = document.getElementById('reg-seminar-id').value;
      const body = {
        name: document.getElementById('reg-name').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        company: document.getElementById('reg-company').value.trim(),
        notes: document.getElementById('reg-notes').value.trim(),
      };
      try {
        const r = await fetch(`/api/seminars/${id}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Fehler');
        closeModal();
        alert(data.message || 'Anmeldung bestätigt!');
        await loadSeminars();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Jetzt anmelden';
      }
    }

    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    loadSeminars();
  </script>
</body>
</html>
