server {
    server_name digitalehandwerkskunst.de www.digitalehandwerkskunst.de;

    root /var/www/digitalehandwerkskunst;
    index index.html;

    # Snack House / Agency (sonst fängt SPA ab → 404)



    
    location = /jay {
        try_files /jay.html =404;
    }

    location = /nils {
        root /var/www/snackhouse-mechernich;
        try_files /nils.html =404;
    }
    location = /agency-hub {
        root /var/www/snackhouse-mechernich;
        try_files /agency-hub.html =404;
    }
    location /ci/ {
        root /var/www/snackhouse-mechernich;
        try_files $uri =404;
    }
    location = /agency-setup {
        root /var/www/snackhouse-mechernich;
        try_files /agency-setup.html =404;
    }

    location = /agency-keys {
        root /var/www/snackhouse-mechernich;
        try_files /agency-keys.html =404;
    }
    location = /agency {
        root /var/www/snackhouse-mechernich;
        try_files /agency.html =404;
    }
    location = /seminare {
        root /var/www/snackhouse-mechernich;
        try_files /seminare.html =404;
    }
    location = /akquise {
        root /var/www/snackhouse-mechernich;
        try_files /akquise-report.html =404;
    }

    # n8n Automation Hub
    # n8n Automation Hub

    # n8n production webhooks (registered at /webhook/ on n8n, not under N8N_PATH)
    location /n8n/webhook/ {
        proxy_pass         http://88.198.170.156:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
    }
    location /n8n/webhook-test/ {
        proxy_pass         http://88.198.170.156:5678/webhook-test/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
    }


    location /n8n/ {
        proxy_pass         http://88.198.170.156:5678/n8n/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        chunked_transfer_encoding off;
    }


    # Voice Demo (Eigenbau) -> voice-01
    location /voice-demo/ {
        proxy_pass         http://88.198.170.156:8090/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }

    
    location /api/nils/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 50m;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # React/Vite SPA
    
    location = /transport-kalkulator {
        try_files /transport-kalkulator.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }


    location ~* ^/(webschmiede-icon|craftsman|vorher-screenshot|nachher-screenshot|christian-kummetat|site-overrides)\.(png|jpg|jpeg|css|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { try_files $uri =404; }
    location = /favicon.png { try_files $uri =404; }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/digitalehandwerkskunst.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/digitalehandwerkskunst.de/privkey.pem; # managed by Certbot
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.digitalehandwerkskunst.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = digitalehandwerkskunst.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name digitalehandwerkskunst.de www.digitalehandwerkskunst.de;
    return 404; # managed by Certbot




}
