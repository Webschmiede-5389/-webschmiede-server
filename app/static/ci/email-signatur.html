<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>E-Mail-Signatur, Webschmiede</title>
  <link rel="stylesheet" href="webschmiede-ci.css">
  <style>
    body { background: #F5F5F5; padding: 24px; }
    .preview { max-width: 520px; margin: 0 auto 24px; background: #fff; padding: 24px; border-radius: 12px; box-shadow: var(--ws-shadow); border: 1px solid var(--ws-border); }
    .copy-box { max-width: 520px; margin: 0 auto; background: #FAFAFA; color: #444; padding: 16px; border-radius: 8px; font-size: 11px; font-family: monospace; white-space: pre-wrap; word-break: break-all; border: 1px solid var(--ws-border); }
    .hint { text-align: center; font-size: 9pt; color: #888; margin-top: 16px; }
  </style>
</head>
<body>
<button class="ws-print-btn ws-no-print" onclick="copySig()">HTML kopieren</button>

<div class="preview" id="sig-preview">
  <table cellpadding="0" cellspacing="0" style="font-family:Inter,Arial,sans-serif;font-size:13px;color:#1A1A1A;">
    <tr>
      <td style="padding-right:14px;vertical-align:top;">
        <img src="webschmiede-logo-mark.png" alt="WebSchmiede" width="48" height="48" style="display:block;">
      </td>
      <td style="border-left:3px solid #FF6600;padding-left:14px;vertical-align:top;">
        <strong style="font-size:14px;color:#1A1A1A;">Christian Kummetat</strong><br>
        <span style="color:#FF6600;font-size:11px;font-weight:600;">Digitaler Handwerksmeister · Webschmiede</span><br>
        <span style="color:#666;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;">Digitale Handwerkskunst</span><br><br>
        <span style="font-size:12px;color:#444;">
          +49 177 8011350<br>
          <a href="mailto:info@digitalehandwerkskunst.de" style="color:#FF6600;text-decoration:none;">info@digitalehandwerkskunst.de</a><br>
          <a href="https://digitalehandwerkskunst.de" style="color:#FF6600;text-decoration:none;">digitalehandwerkskunst.de</a>
        </span>
      </td>
    </tr>
  </table>
</div>

<div class="copy-box ws-no-print" id="sig-html"></div>
<p class="hint ws-no-print">Gmail: Einstellungen → Signatur → HTML einfügen</p>

<script>
const html = document.getElementById('sig-preview').innerHTML.trim();
document.getElementById('sig-html').textContent = html;
function copySig() {
  navigator.clipboard.writeText(html).then(() => alert('Signatur-HTML kopiert!'));
}
</script>
</body>
</html>
