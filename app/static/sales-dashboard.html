<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Pipeline · Webschmiede</title>
  <link rel="icon" href="/ci/webschmiede-logo-mark.png" />
  <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600|libre-baskerville:600" rel="stylesheet" />
  <style>
    :root { --bg:#0e0b08; --panel:#1a1510; --ink:#f3efe6; --muted:#9a9080; --gold:#C9A84C; --line:#2a241c; --ok:#3d9a6a; --bad:#c45c4a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:"DM Sans",system-ui,sans-serif;
      background:radial-gradient(1100px 520px at 15% -8%, #2a1f12 0%, var(--bg) 55%); color:var(--ink); }
    .wrap { max-width:960px; margin:0 auto; padding:28px 18px 70px; }
    header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
    header img { height:36px; }
    h1 { font-family:"Libre Baskerville",Georgia,serif; font-size:1.35rem; margin:0; }
    .sub { color:var(--muted); font-size:0.9rem; margin-top:4px; }
    .panel { background:color-mix(in srgb,var(--panel) 92%,black); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
    label { display:block; font-size:0.8rem; color:var(--muted); margin:10px 0 6px; }
    input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#120f0c; color:var(--ink); font:inherit; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:700px){ .row{grid-template-columns:1fr;} }
    .btn { display:inline-block; margin-top:14px; margin-right:8px; border:0; border-radius:10px; background:var(--gold); color:#1a1408; font-weight:600; padding:12px 18px; cursor:pointer; font:inherit; }
    .btn.ghost { background:transparent; color:var(--gold); border:1px solid var(--gold); }
    .msg { margin-top:12px; font-size:0.9rem; color:var(--muted); white-space:pre-wrap; }
    .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--gold); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:0.75rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="/ci/webschmiede-logo.png" alt="Webschmiede" />
      <div>
        <h1>Sales Pipeline</h1>
        <div class="sub">Mail → Discovery → deine Freigabe → Preis → Zahlung</div>
      </div>
    </header>

    <div class="panel">
      <label>Agency-Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <h2 style="font-size:1.05rem;margin:18px 0 0;font-family:Libre Baskerville,Georgia,serif;">Neuen Kunden einladen</h2>
      <div class="row">
        <div><label>E-Mail *</label><input id="email" type="email" placeholder="kunde@firma.de" /></div>
        <div><label>Firma</label><input id="firma" type="text" /></div>
      </div>
      <div class="row">
        <div><label>Kontaktname</label><input id="kontakt" type="text" /></div>
        <div><label>Telefon (WhatsApp optional)</label><input id="phone" type="text" placeholder="+49…" /></div>
      </div>
      <label>Website (für Research)</label>
      <input id="website" type="text" placeholder="https://…" />
      <button class="btn" id="btnInvite" type="button">Einladung senden</button>
      <button class="btn ghost" id="btnRefresh" type="button">Liste laden</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>Firma</th><th>Status</th><th>Preis</th><th>Aktion</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script src="/agency-auth.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function hdr() {
      const h = AgencyAuth.headers();
      // Einmalig Login aus PW-Feld, falls noch kein Token
      return h;
    }
    async function ensureAuth() {
      if (AgencyAuth.getToken()) return;
      const pw = $("pw").value.trim();
      if (!pw) throw new Error("Passwort fehlt");
      await AgencyAuth.login("", pw);
    }
    function msg(t, ok) { const el=$("msg"); el.textContent=t||""; el.className="msg"+(ok===true?" ok":ok===false?" err":""); }

    async function invite() {
      msg("Sende…");
      try {
        await ensureAuth();
      } catch (e) { msg(e.message || "Login", false); return; }
      const res = await fetch("/api/sales/invite", {
        method: "POST", headers: hdr(), credentials: "same-origin",
        body: JSON.stringify({
          email: $("email").value.trim(),
          firma: $("firma").value.trim(),
          kontakt: $("kontakt").value.trim(),
          phone: $("phone").value.trim(),
          website: $("website").value.trim(),
        }),
      });
      const data = await res.json();
      if (!res.ok) { msg(data.error || "Fehler", false); return; }
      msg("Einladung raus. Deal " + data.id + (data.discovery_link ? "\n" + data.discovery_link : ""), true);
      load();
    }

    async function setPrice(id) {
      const setup = prompt("Setup €", "1200");
      const monthly = prompt("Monat €", "248");
      if (setup == null || monthly == null) return;
      const res = await fetch(`/api/sales/deals/${id}/price`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ setup_eur: Number(setup), monthly_eur: Number(monthly), send_offer: true }),
      });
      const data = await res.json();
      msg(res.ok ? "Angebot mit Preis gesendet" : (data.error || "Fehler"), res.ok);
      load();
    }

    async function freigabe(id) {
      if (!confirm("Einschätzung jetzt an den Kunden senden?")) return;
      const res = await fetch(`/api/sales/deals/${id}/freigabe`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ action: "send_pain" }),
      });
      const data = await res.json();
      msg(res.ok ? "Freigegeben und an Kunden gesendet" : (data.error || "Fehler"), res.ok);
      load();
    }

    async function hold(id) {
      const note = prompt("Grund / Notiz (optional)", "Noch prüfen");
      const res = await fetch(`/api/sales/deals/${id}/freigabe`, {
        method: "POST", headers: hdr(),
        body: JSON.stringify({ action: "hold", note: note || "" }),
      });
      const data = await res.json();
      msg(res.ok ? "Zurückgehalten" : (data.error || "Fehler"), res.ok);
      load();
    }

    async function checkout(id) {
      const res = await fetch(`/api/sales/deals/${id}/checkout`, { method: "POST", headers: hdr(), body: "{}" });
      const data = await res.json();
      msg(res.ok ? ("Checkout: " + (data.checkout_url || "")) : (data.error || "Fehler"), res.ok);
      load();
    }

    async function load() {
      try { await ensureAuth(); } catch (e) { msg(e.message || "Login", false); return; }
      const res = await fetch("/api/sales/deals", { headers: hdr(), credentials: "same-origin" });
      const data = await res.json();
      if (!res.ok) { msg(data.error || "Liste braucht Agency-Login", false); return; }
      $("rows").innerHTML = (data.deals || []).map(d => {
        const needFg = d.status === "awaiting_freigabe_pain";
        return `
        <tr>
          <td>${esc(d.firma || d.email)}<br><span class="pill">${esc(d.email||"")}</span></td>
          <td><span class="pill">${esc(d.status)}</span>${needFg ? " <span class=\"pill\" style=\"border-color:var(--gold);color:var(--gold)\">Freigabe</span>" : ""}</td>
          <td>${d.price_setup_eur ? (d.price_setup_eur + " / " + d.price_monthly_eur) : "–"}</td>
          <td>
            ${needFg ? `<button class="btn" style="margin:0;padding:6px 10px;font-size:0.8rem" onclick="freigabe('${d.id}')">Freigabe</button>
            <button class="btn ghost" style="margin:0;padding:6px 10px;font-size:0.8rem" onclick="hold('${d.id}')">Halten</button>` : ""}
            <button class="btn ghost" style="margin:0;padding:6px 10px;font-size:0.8rem" onclick="setPrice('${d.id}')">Preis</button>
            <button class="btn ghost" style="margin:0;padding:6px 10px;font-size:0.8rem" onclick="checkout('${d.id}')">Checkout</button>
            <a class="btn ghost" style="margin:0;padding:6px 10px;font-size:0.8rem;text-decoration:none" href="/sales-angebot.html?d=${d.id}" target="_blank">Ansicht</a>
          </td>
        </tr>`;
      }).join("") || "<tr><td colspan=4>Noch keine Deals</td></tr>";
    }
    function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    $("btnInvite").onclick = () => invite().catch(e => msg(e.message, false));
    $("btnRefresh").onclick = () => load().catch(e => msg(e.message, false));
  </script>
</body>
</html>
